name: Job Scraper

on:
  # Your own pushes start a run. The bot's commits say [skip ci], so they don't:
  # a scraper that shows a different set of postings each run would otherwise
  # close and reopen them every run, and each commit would start the next run.
  push:
    branches:
      - main
  # Hourly, 6am-11pm Eastern: hourly.yml starts each run, since GitHub's own
  # schedule fires only a few of its hourly slots a day.
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: overlapping runs both emailed the same new jobs before
# either saved them. A run that arrives meanwhile waits for this one.
concurrency:
  group: job-scraper
  cancel-in-progress: false

env:
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  ICONS_ID: ${{ secrets.ICONS_ID }}
  ICONS_API: ${{ secrets.ICONS_API }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          # Latest main, not the commit that triggered this run: a run that
          # waited behind another must start from the storage it just saved.
          ref: main
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # A virtual display: Tesla's bot check refuses headless Chrome.
          sudo apt-get install -y -q xvfb

      - name: Scrape jobs
        run: xvfb-run -a .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      # Only new companies or changed icons download anything.
      - name: Fetch new company logos
        continue-on-error: true
        run: .venv/bin/python -m phlux.site logos

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add storage.json README.md icons.json listings logos
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update storage.json, readme and icons.json [bot] [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Trash internship alert emails older than 14 days
        continue-on-error: true
        run: .venv/bin/python -m phlux.mail_cleanup

      # The site comes after the commit and can't fail the job: a failed job
      # starts the retry job, which scrapes and emails again.
      - name: Build the Phlux site
        id: site
        continue-on-error: true
        run: .venv/bin/python -m phlux.site --out site

      - name: Upload the site
        if: steps.site.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: run
    runs-on: ubuntu-latest
    # Fails until GitHub Pages is switched on (Settings → Pages → Source:
    # GitHub Actions); that mustn't mark every scrape run as failed.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  retry:
    needs: run
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retry
        run: sleep 300

      - uses: actions/checkout@v3
        with:
          # Latest main, not the commit that triggered this run: a run that
          # waited behind another must start from the storage it just saved.
          ref: main
          token: ${{ secrets.GH_ACTIONS_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          # A virtual display: Tesla's bot check refuses headless Chrome.
          sudo apt-get install -y -q xvfb

      - name: Scrape jobs (retry)
        run: xvfb-run -a .venv/bin/python main.py

      - name: Generate README
        run: .venv/bin/python generate_readme.py

      - name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add storage.json README.md icons.json listings
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update storage.json, readme and icons.json [bot] [skip ci]"
            git pull --rebase origin main
            git push
          fi
